<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<style>html{color-scheme:dark}body{margin:0}</style>
<title>Educatius School Portal</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700&family=Jost:wght@400;500;600&display=swap">
<style>
/* Layout: sticky wordmark header, 4-up card grid on home, Apple-style bento grid on detail. */
:root {
  --bg: #1b1c1e;
  --surface: #25272a;
  --surface-2: #2d3033;
  --line: #3a3d41;
  --fg: #efeeea;
  --muted: #9fa3a8;
  --accent: #5cbf93;
  --accent-ink: #0f2a1e;
  --open: #5cbf93;
  --closed: #d98a7c;
  --display: Futura, "Futura PT", "Jost", "Century Gothic", "Avenir Next", sans-serif;
  --body: "DM Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--fg); font-family: var(--body); font-size: 15px; line-height: 1.5; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); background: var(--bg); z-index: 10; }
a { color: inherit; text-decoration: none; }
a:focus-visible, button:focus-visible { outline: 2px solid var(--accent); outline-offset: 3px; border-radius: 6px; }

.wrap { max-width: 1320px; margin: 0 auto; }
header.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 9; background: var(--bg); border-bottom: 1px solid var(--line); margin-left: calc(-1 * max(16px, env(safe-area-inset-left, 0px))); margin-right: calc(-1 * max(16px, env(safe-area-inset-right, 0px))); padding: 0 max(16px, env(safe-area-inset-right, 0px)) 0 max(16px, env(safe-area-inset-left, 0px)); }
header.top .wrap { display: flex; align-items: center; justify-content: space-between; height: 60px; }
.logo { font-family: var(--display); font-weight: 500; font-size: 26px; letter-spacing: 0.01em; }
.top-note { font-size: 12px; letter-spacing: 0.14em; text-transform: uppercase; color: var(--muted); }

.intro { padding-block: 40px 24px; display: flex; flex-wrap: wrap; align-items: end; justify-content: space-between; gap: 12px 24px; }
.intro h1 { font-family: var(--display); font-weight: 500; font-size: clamp(30px, 4.2vw, 48px); line-height: 1.08; margin: 0; letter-spacing: -0.01em; text-wrap: balance; }
.intro p { margin: 0; color: var(--muted); }

.grid { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: 20px; padding-bottom: 72px; }
.card { display: flex; flex-direction: column; background: var(--surface); border-radius: 14px; overflow: hidden; transition: transform .18s ease, background .18s ease; }
.card:hover { transform: translateY(-4px); background: var(--surface-2); }
.card .media { aspect-ratio: 4 / 3; position: relative; }
.card .body { padding: 16px 16px 18px; display: flex; flex-direction: column; gap: 10px; flex: 1; }
.card h2 { font-family: var(--display); font-weight: 500; font-size: 19px; line-height: 1.2; margin: 0; text-wrap: balance; }
.loc { color: var(--muted); font-size: 13px; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { font-size: 12px; padding: 3px 10px; border-radius: 999px; background: var(--surface-2); color: var(--fg); border: 1px solid var(--line); }
.card:hover .chip { background: var(--bg); }
.card .foot { margin-top: auto; padding-top: 12px; display: flex; align-items: end; justify-content: space-between; gap: 8px; border-top: 1px solid var(--line); }
.price { font-family: var(--display); font-size: 22px; font-weight: 500; font-variant-numeric: tabular-nums; }
.price small { display: block; font-family: var(--body); font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: var(--muted); }
.avail { display: flex; flex-direction: column; gap: 2px; font-size: 12px; color: var(--muted); text-align: right; }
.dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; margin-right: 6px; background: var(--open); }
.dot.closed { background: var(--closed); }
.school-logo { position: absolute; right: 12px; bottom: 12px; width: 52px; height: 52px; border-radius: 50%; overflow: hidden; background: var(--surface-2); border: 2px solid var(--bg); z-index: 2; display: grid; place-items: center; font-family: var(--display); font-size: 15px; color: var(--muted); }
.school-logo img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; background: #fff; }
.grade-badge { position: absolute; top: 12px; left: 12px; background: var(--bg); color: var(--fg); font-family: var(--display); font-weight: 500; font-size: 14px; padding: 4px 10px; border-radius: 8px; z-index: 2; }
.grade-badge b { color: var(--accent); font-weight: 600; }

/* image placeholder and real image share one slot */
.ph { position: absolute; inset: 0; display: grid; place-items: center; overflow: hidden; }
.ph .ini { font-family: var(--display); font-weight: 500; font-size: clamp(44px, 7vw, 84px); letter-spacing: 0.04em; color: rgba(255,255,255,.14); }
.ph .slot { position: absolute; left: 14px; bottom: 12px; font-size: 11px; letter-spacing: 0.1em; text-transform: uppercase; color: rgba(255,255,255,.45); }
.media img.real, .slotbox img.real, .hero img.real { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }

/* detail */
.mapbox { height: 380px; border-radius: 12px; overflow: hidden; background: var(--surface-2); margin-top: 10px; }
.mapbox iframe { display: block; width: 100%; height: 100%; border: 0; }
.mapbox iframe.gray { filter: grayscale(1) contrast(1.05) brightness(.96); }
@media (max-width: 720px) { .mapbox { height: 300px; } }
.state { color: var(--muted); padding-block: 80px; text-align: center; }
.back { display: inline-flex; align-items: center; gap: 8px; color: var(--muted); font-size: 14px; padding-block: 22px 14px; }
.back:hover { color: var(--fg); }
.hero { position: relative; border-radius: 18px; overflow: hidden; aspect-ratio: 21 / 9; min-height: 260px; background: var(--surface); }
.hero::after { content: ""; position: absolute; inset: 0; background: linear-gradient(to top, rgba(14,15,16,.82), rgba(14,15,16,0) 62%); z-index: 1; }
.hero .txt { position: absolute; left: clamp(18px, 3vw, 36px); right: clamp(18px, 3vw, 36px); bottom: clamp(18px, 3vw, 32px); z-index: 2; }
.hero h1 { font-family: var(--display); font-weight: 500; font-size: clamp(30px, 5vw, 58px); line-height: 1.05; margin: 0 0 8px; letter-spacing: -0.01em; text-wrap: balance; }
.hero .sub { color: #d6d5d0; margin-bottom: 14px; }
.hero .chip { background: rgba(27,28,30,.7); border-color: rgba(255,255,255,.2); backdrop-filter: blur(6px); }

.bento { display: grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 16px; margin-top: 16px; padding-bottom: 72px; }
.tile { background: var(--surface); border-radius: 18px; padding: clamp(18px, 2.4vw, 28px); display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.s3 { grid-column: span 3; } .s4 { grid-column: span 4; } .s6 { grid-column: span 6; } .s8 { grid-column: span 8; } .s12 { grid-column: span 12; }
.lbl { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: var(--muted); }
.big { font-family: var(--display); font-weight: 500; font-size: clamp(42px, 5.4vw, 76px); line-height: 1; letter-spacing: -0.02em; font-variant-numeric: tabular-nums; margin-top: auto; padding-top: 18px; }
.big.accent { color: var(--accent); }
.big.mid { font-size: clamp(30px, 3.6vw, 48px); }
.note { color: var(--muted); font-size: 14px; }
.pair { display: grid; grid-template-columns: 1fr 1fr; gap: 16px; margin-top: auto; padding-top: 18px; }
.pair .big { padding-top: 6px; font-size: clamp(36px, 4.4vw, 60px); }
.stats { display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); gap: 16px; margin-top: 14px; }
.stats .big { font-size: clamp(28px, 3.4vw, 44px); padding-top: 8px; }
.rows { display: flex; flex-direction: column; margin-top: 10px; }
.row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 11px 0; border-top: 1px solid var(--line); }
.row:first-child { border-top: 0; }
.pill { font-size: 12px; font-weight: 500; padding: 3px 11px; border-radius: 999px; background: var(--surface-2); }
.pill.open { background: rgba(92,191,147,.16); color: var(--open); }
.pill.closed { background: rgba(217,138,124,.16); color: var(--closed); }
.pill.yes { background: rgba(92,191,147,.16); color: var(--open); }
.tags { display: flex; flex-wrap: wrap; gap: 10px; margin-top: auto; padding-top: 18px; }
.tag { font-family: var(--display); font-size: clamp(20px, 2.4vw, 30px); font-weight: 500; padding: 8px 18px; border-radius: 999px; border: 1px solid var(--line); }
.slotbox { position: relative; padding: 0; overflow: hidden; aspect-ratio: 16 / 10; }
.cta { flex-direction: row; align-items: center; justify-content: space-between; flex-wrap: wrap; gap: 14px 24px; }
.cta h3 { font-family: var(--display); font-weight: 500; font-size: 24px; margin: 0; }
.btn { font: inherit; font-weight: 700; background: var(--accent); color: var(--accent-ink); border: 0; padding: 12px 22px; border-radius: 999px; cursor: pointer; }
.btn:hover { filter: brightness(1.08); }
.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); background: var(--fg); color: var(--bg); padding: 12px 18px; border-radius: 12px; font-size: 14px; max-width: min(92vw, 460px); z-index: 20; }
footer { border-top: 1px solid var(--line); padding-block: 22px 30px; color: var(--muted); font-size: 13px; }

.intro-r { display: flex; align-items: center; gap: 16px; flex-wrap: wrap; }
.sort-sel { font: inherit; font-size: 14px; color: var(--fg); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 8px 14px; cursor: pointer; max-width: 100%; }
.sort-sel:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.view-toggle { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
.view-toggle button { border: 0; background: transparent; color: var(--muted); width: 42px; height: 34px; border-radius: 999px; cursor: pointer; display: grid; place-items: center; }
.view-toggle button:hover { color: var(--fg); }
.view-toggle button[aria-pressed="true"] { background: var(--fg); color: var(--bg); }
.list { display: flex; flex-direction: column; gap: 12px; padding-bottom: 72px; }
.lrow { display: grid; grid-template-columns: 200px minmax(0, 1fr) auto; align-items: center; gap: 24px; background: var(--surface); border-radius: 14px; padding: 12px 24px 12px 12px; transition: background .18s ease; }
.lrow:hover { background: var(--surface-2); }
.lrow .media { aspect-ratio: 4 / 3; position: relative; border-radius: 10px; overflow: hidden; }
.lrow .school-logo { width: 38px; height: 38px; right: 8px; bottom: 8px; font-size: 12px; }
.lrow .grade-badge { top: 8px; left: 8px; font-size: 12px; padding: 3px 8px; }
.linfo { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.linfo h2 { font-family: var(--display); font-weight: 500; font-size: 22px; line-height: 1.2; margin: 0; text-wrap: balance; }
.lrow:hover .chip { background: var(--bg); }
.lright { display: flex; align-items: center; gap: 32px; }
@media (max-width: 720px) {
  .intro-r { width: 100%; gap: 12px; }
  .intro-r p { width: 100%; }
  .sort-sel { flex: 1; min-width: 0; }
  .lrow { grid-template-columns: 112px minmax(0, 1fr); gap: 14px; padding: 10px; }
  .linfo h2 { font-size: 17px; }
  .lright { grid-column: 1 / -1; justify-content: space-between; padding-top: 10px; border-top: 1px solid var(--line); }
  .lrow .school-logo { width: 28px; height: 28px; font-size: 10px; }
}
@media (max-width: 1100px) { .grid { grid-template-columns: repeat(3, minmax(0, 1fr)); } }
@media (max-width: 900px) {
  .bento { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .s3, .s4 { grid-column: span 1; } .s6, .s8, .s12 { grid-column: span 2; }
  .stats { grid-template-columns: repeat(3, minmax(0, 1fr)); }
  .hero { aspect-ratio: 16 / 10; }
}
@media (max-width: 720px) { .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 12px; } .card h2 { font-size: 16px; } .price { font-size: 18px; } }
@media (max-width: 480px) { .grid { grid-template-columns: minmax(0, 1fr); } .bento { gap: 12px; } .top-note { display: none; } }
@media (prefers-reduced-motion: reduce) { .card { transition: none; } .card:hover { transform: none; } }
</style>

<header class="top"><div class="wrap">
  <a class="logo" href="#" aria-label="Educatius, all schools">Educatius</a>
  <span class="top-note">School Portal</span>
</div></header>
<main class="wrap" id="app"></main>
<div class="wrap"><footer>Educatius School Portal</footer></div>
<div id="toast" class="toast" role="status" hidden></div>

<script src="config.js"></script>
<script>
var SCHOOLS = [];
var STATE = "loading";

function esc(s) { return String(s).replace(/[&<>"]/g, function (c) { return { "&":"&amp;", "<":"&lt;", ">":"&gt;", '"':"&quot;" }[c]; }); }
function money(v) { return String(v).replace(/\.00$/, ""); }
var COUNTRY = null;
/* Price markup added to the sheet's AYP NET. Change here, or override with MARKUP: { KR: 5000, DEFAULT: 3000 } in config.js. */
function markupFor() {
  var m = (window.PORTAL_CONFIG && window.PORTAL_CONFIG.MARKUP) || {};
  var kr = typeof m.KR === "number" ? m.KR : 5000;
  var other = typeof m.DEFAULT === "number" ? m.DEFAULT : 3000;
  return COUNTRY === "KR" ? kr : other;
}
function baseNum(s) { var n = parseFloat(String(s["AYP NET"] || "").replace(/[^0-9.]/g, "")); return isNaN(n) ? null : n; }
function shownPrice(s) { var n = baseNum(s); return n === null ? "" : "$" + (n + markupFor()).toLocaleString("en-US"); }
function has(v) { return v !== undefined && v !== null && String(v).trim() !== ""; }
function isYes(v) { return String(v).toUpperCase() === "YES"; }
function initials(name) { return name.split(/\s+/).filter(Boolean).slice(0, 3).map(function (w) { return w[0].toUpperCase(); }).join(""); }
function gradeParts(g) { var m = String(g).match(/^([A-F])([+-]?)$/); return m ? '<b>' + m[1] + '</b>' + m[2] : esc(g); }
function gradesText(v) { return String(v).split(",").map(function (x) { return x.trim(); }).join(", "); }

/* Drive image with fallbacks: tries three Google image URLs in order, removes itself if all fail. */
function driveSrc(id, step, w) {
  return [
    "https://lh3.googleusercontent.com/d/" + id + "=w" + w,
    "https://drive.google.com/thumbnail?id=" + id + "&sz=w" + w,
    "https://drive.google.com/uc?export=view&id=" + id
  ][step];
}
function driveImg(id, w, cls) {
  return '<img class="' + cls + '" alt="" referrerpolicy="no-referrer" data-id="' + id + '" data-w="' + w + '" data-step="0" src="' + driveSrc(id, 0, w) + '" onerror="imgFallback(this)">';
}
function imgFallback(el) {
  var n = Number(el.getAttribute("data-step")) + 1;
  if (n > 2) { el.remove(); return; }
  el.setAttribute("data-step", n);
  el.src = driveSrc(el.getAttribute("data-id"), n, el.getAttribute("data-w"));
}

/* A media slot: designed placeholder underneath, real Drive image on top when it loads. */
function slot(s, key, label, idx) {
  var hue = 150 + idx * 38;
  var id = s.images && s.images[key];
  var img = id ? driveImg(id, 1400, "real") : "";
  var tag = label ? '<span class="slot">' + esc(label) + '</span>' : "";
  return '<div class="ph" style="background:linear-gradient(135deg,hsl(' + hue + ' 9% 25%),hsl(' + (hue + 20) + ' 10% 15%))"><span class="ini">' + esc(initials(s["School"])) + '</span>' + tag + '</div>' + img;
}

/* Round logo at the bottom-right of the card photo; initials show until the logo file loads. */
function logoBadge(s) {
  var id = s.images && s.images.logo;
  var img = id ? driveImg(id, 200, "") : "";
  return '<span class="school-logo">' + esc(initials(s["School"]).slice(0, 2)) + img + '</span>';
}

function availDot(v) { return '<span class="dot' + (String(v).toUpperCase() === "OPEN" ? "" : " closed") + '"></span>'; }

var SORT = "name-asc";
var SORTS = [
  ["name-asc", "Name A-Z"], ["name-desc", "Name Z-A"], ["region-asc", "Region A-Z"],
  ["niche-desc", "Niche grade: best first"], ["tuition-asc", "Tuition: low to high"], ["tuition-desc", "Tuition: high to low"]
];
try { var savedSort = localStorage.getItem("portalSort"); if (SORTS.some(function (x) { return x[0] === savedSort; })) SORT = savedSort; } catch (e) {}

function nameKey(s) { return String(s["School"]).toLowerCase(); }
function cmpText(a, b) { return String(a).localeCompare(String(b), "en", { sensitivity: "base" }); }
/* lower number = better grade (A+ = 0 ... F- = 17). Missing grades sort last. */
function gradeRank(g) {
  var m = String(g || "").trim().toUpperCase().match(/^([A-F])([+-]?)$/);
  if (!m) return 99;
  return (m[1].charCodeAt(0) - 65) * 3 + (m[2] === "+" ? 0 : m[2] === "" ? 1 : 2);
}
/* number from "$18,950.00"; missing values sort last in both directions */
function tuitionNum(s) { var n = parseFloat(String(s["AYP NET"] || "").replace(/[^0-9.]/g, "")); return isNaN(n) ? null : n; }
function sortList(list) {
  var out = list.slice();
  out.sort(function (a, b) {
    var r = 0;
    if (SORT === "name-asc") r = cmpText(nameKey(a), nameKey(b));
    else if (SORT === "name-desc") r = cmpText(nameKey(b), nameKey(a));
    else if (SORT === "region-asc") r = cmpText(a["State"], b["State"]) || cmpText(a["City"], b["City"]);
    else if (SORT === "niche-desc") r = gradeRank(a["Niche Ranking"]) - gradeRank(b["Niche Ranking"]);
    else {
      var x = tuitionNum(a), y = tuitionNum(b);
      if (x === null && y === null) r = 0; else if (x === null) return 1; else if (y === null) return -1;
      else r = SORT === "tuition-asc" ? x - y : y - x;
    }
    return r || cmpText(nameKey(a), nameKey(b));
  });
  return out;
}

var VIEW = "card";
try { if (localStorage.getItem("portalView") === "list") VIEW = "list"; } catch (e) {}

function schoolChips(s) {
  return [s["Type"], s["GENDER"], has(s["Religion"]) && s["Religion"] !== "No Religious" ? s["Religion"] : ""].filter(has)
    .map(function (c) { return '<span class="chip">' + esc(c) + '</span>'; }).join("");
}
function mediaBlock(s, i) {
  return '<div class="media">' + (has(s["Niche Ranking"]) ? '<span class="grade-badge">Niche ' + gradeParts(s["Niche Ranking"]) + '</span>' : "") + slot(s, "main", "", i) + logoBadge(s) + '</div>';
}
function availBlock(s) {
  return '<div class="avail"><span>' + availDot(s["Availability-Jan 27"]) + 'Jan 2027</span><span>' + availDot(s["Availability-Aug 27"]) + 'Aug 2027</span></div>';
}
function priceBlock(s) {
  return '<div class="price"><small>Tuition</small>' + esc(shownPrice(s)) + '</div>';
}

function renderHome() {
  var list = sortList(SCHOOLS.filter(function (s) { return isYes(s["Publish"]); }));
  var body;
  if (VIEW === "list") {
    body = '<section class="list">' + list.map(function (s, i) {
      return '<a class="lrow" href="#' + s["School ID"] + '">' + mediaBlock(s, i) +
        '<div class="linfo"><h2>' + esc(s["School"]) + '</h2><div class="loc">' + esc(s["City"]) + ', ' + esc(s["State"]) + '</div><div class="chips">' + schoolChips(s) + '</div></div>' +
        '<div class="lright">' + priceBlock(s) + availBlock(s) + '</div></a>';
    }).join("") + '</section>';
  } else {
    body = '<section class="grid">' + list.map(function (s, i) {
      return '<a class="card" href="#' + s["School ID"] + '">' + mediaBlock(s, i) +
        '<div class="body"><h2>' + esc(s["School"]) + '</h2><div class="loc">' + esc(s["City"]) + ', ' + esc(s["State"]) + '</div>' +
        '<div class="chips">' + schoolChips(s) + '</div><div class="foot">' + priceBlock(s) + availBlock(s) + '</div></div></a>';
    }).join("") + '</section>';
  }
  var iconCard = '<svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><rect x="1" y="1" width="7" height="7" rx="1.5"/><rect x="10" y="1" width="7" height="7" rx="1.5"/><rect x="1" y="10" width="7" height="7" rx="1.5"/><rect x="10" y="10" width="7" height="7" rx="1.5"/></svg>';
  var iconList = '<svg width="18" height="18" viewBox="0 0 18 18" fill="currentColor" aria-hidden="true"><rect x="1" y="2" width="16" height="3.4" rx="1.2"/><rect x="1" y="7.3" width="16" height="3.4" rx="1.2"/><rect x="1" y="12.6" width="16" height="3.4" rx="1.2"/></svg>';
  var sortSel = '<select id="sortSel" class="sort-sel" aria-label="Sort schools">' + SORTS.map(function (o) {
    return '<option value="' + o[0] + '"' + (o[0] === SORT ? " selected" : "") + '>' + o[1] + '</option>';
  }).join("") + '</select>';
  var toggle = '<div class="view-toggle" role="group" aria-label="View mode">' +
    '<button type="button" data-view="card" aria-pressed="' + (VIEW === "card") + '" aria-label="Card view" title="Card view">' + iconCard + '</button>' +
    '<button type="button" data-view="list" aria-pressed="' + (VIEW === "list") + '" aria-label="List view" title="List view">' + iconList + '</button></div>';
  return '<section class="intro"><h1>Find your school in the United States</h1><div class="intro-r"><p>' + list.length + ' schools</p>' + sortSel + toggle + '</div></section>' + body;
}

function bindToggle() {
  var sel = document.getElementById("sortSel");
  if (sel) sel.addEventListener("change", function () {
    SORT = sel.value;
    try { localStorage.setItem("portalSort", SORT); } catch (e) {}
    document.getElementById("app").innerHTML = renderHome();
    bindToggle();
  });
  var btns = document.querySelectorAll(".view-toggle button");
  Array.prototype.forEach.call(btns, function (b) {
    b.addEventListener("click", function () {
      VIEW = b.getAttribute("data-view");
      try { localStorage.setItem("portalView", VIEW); } catch (e) {}
      document.getElementById("app").innerHTML = renderHome();
      bindToggle();
    });
  });
}

function tile(span, label, value, opts) {
  opts = opts || {};
  return '<div class="tile ' + span + '"><span class="lbl">' + esc(label) + '</span>' +
    '<div class="big' + (opts.accent ? " accent" : "") + (opts.mid ? " mid" : "") + '">' + (opts.raw ? value : esc(value)) + '</div>' +
    (opts.sub ? '<div class="note">' + esc(opts.sub) + '</div>' : "") + '</div>';
}

function renderDetail(s, idx) {
  var t = [];
  var subtitle = [s["City"] + ", " + s["State"], has(s["Founded"]) ? "Founded " + s["Founded"] : ""].filter(has).join("  ·  ");
  var chips = [s["Type"], s["GENDER"], has(s["Religion"]) ? (s["Religion"] === "No Religious" ? "No religious affiliation" : s["Religion"]) : ""].filter(has)
    .map(function (c) { return '<span class="chip">' + esc(c) + '</span>'; }).join("");

  if (has(s["Niche Ranking"])) t.push(tile("s3", "Niche grade", gradeParts(s["Niche Ranking"]), { raw: true, accent: true }));
  if (has(s["Total Students"])) t.push(tile("s3", "Students", s["Total Students"], { sub: has(s["HS Students"]) ? s["HS Students"] + " in high school" : "" }));
  if (has(s["Student:Teacher"])) t.push(tile("s3", "Student : Teacher", s["Student:Teacher"]));
  if (has(s["Univ. Accept Rate"])) t.push(tile("s3", "University acceptance", s["Univ. Accept Rate"], { accent: true }));

  if (has(s["AYP NET"])) t.push(tile("s6", "Tuition", shownPrice(s)));
  var av = [["Jan 2027", s["Availability-Jan 27"]], ["Aug 2027", s["Availability-Aug 27"]], ["Three semester, Jan 2027", s["Three Sem-Jan 2027"]], ["Three semester, Aug 2027", s["Three Sem-Aug 2027"]]].filter(function (r) { return has(r[1]); });
  if (av.length) t.push('<div class="tile s6"><span class="lbl">Availability</span><div class="rows">' + av.map(function (r) {
    var open = String(r[1]).toUpperCase() === "OPEN";
    return '<div class="row"><span>' + esc(r[0]) + '</span><span class="pill ' + (open ? "open" : "closed") + '">' + (open ? "Open" : "Closed") + '</span></div>';
  }).join("") + '</div></div>');

  if (has(s["Avg. SAT"]) || has(s["Avg. ACT"])) {
    t.push('<div class="tile s4"><span class="lbl">Average test scores</span><div class="pair">' +
      (has(s["Avg. SAT"]) ? '<div><span class="note">SAT</span><div class="big">' + esc(s["Avg. SAT"]) + '</div></div>' : "") +
      (has(s["Avg. ACT"]) ? '<div><span class="note">ACT</span><div class="big">' + esc(s["Avg. ACT"]) + '</div></div>' : "") + '</div></div>');
  }
  if (has(s["Available Age from"])) t.push(tile("s4", "Age range", s["Available Age from"] + "-" + s["Available Age to"], { sub: has(s["Accepting Grade"]) ? "Grades " + gradesText(s["Accepting Grade"]) : "" }));
  if (has(s["Climate"])) t.push(tile("s4", "Climate", s["Climate"], { mid: true }));

  if (has(s["Special Programs"])) {
    t.push('<div class="tile s6"><span class="lbl">Special programs</span><div class="tags">' + s["Special Programs"].split(",").map(function (p) { return '<span class="tag">' + esc(p.trim()) + '</span>'; }).join("") + '</div></div>');
  }
  var sup = [["ESL support", s["ESL Support"]], ["1-year diploma", s["1yr Diploma"]], ["Interview required", s["Adm-Interview"]], ["Graduate students accepted", s["Adm-Accept Grad students?"]]].filter(function (r) { return has(r[1]); });
  if (sup.length) t.push('<div class="tile s6"><span class="lbl">Support and admission</span><div class="rows">' + sup.map(function (r) {
    return '<div class="row"><span>' + esc(r[0]) + '</span><span class="pill ' + (isYes(r[1]) ? "yes" : "") + '">' + (isYes(r[1]) ? "Yes" : "No") + '</span></div>';
  }).join("") + '</div></div>');

  var req = [["Duolingo", s["Adm-Duolingo"]], ["IELTS", s["Adm-IELTS"]], ["TOEFL", s["Adm-TOEFL"]], ["ELTiS", s["Adm-ELTIS 2.0"]], ["Min. grade", s["Adm-Grade Req"]]].filter(function (r) { return has(r[1]); });
  if (req.length) t.push('<div class="tile s12"><span class="lbl">English and academic requirements</span><div class="stats">' + req.map(function (r) {
    return '<div><span class="note">' + esc(r[0]) + '</span><div class="big">' + esc(r[1]) + '</div></div>';
  }).join("") + '</div></div>');

  t.push('<div class="tile s6 slotbox">' + slot(s, "1", "Image 1", idx + 1) + '</div>');
  t.push('<div class="tile s6 slotbox">' + slot(s, "2", "Image 2", idx + 2) + '</div>');

  t.push('<div class="tile s12"><span class="lbl">Location</span><div class="mapbox" id="map"></div><div class="note">' + esc([s["City"], s["State"]].filter(has).join(", ")) + '</div></div>');

  t.push('<div class="tile s12 cta"><h3>' + esc(s["School"]) + ' profile</h3><button class="btn" id="pdfBtn" type="button">Download PDF</button></div>');

  return '<a class="back" href="#">&larr; All schools</a>' +
    '<section class="hero">' + slot(s, "main", "Main image", idx) + '<div class="txt"><h1>' + esc(s["School"]) + '</h1><div class="sub">' + esc(subtitle) + '</div><div class="chips">' + chips + '</div></div></section>' +
    '<section class="bento">' + t.join("") + '</section>';
}

/* ---------- Map: monotone Google Map (needs GOOGLE_MAPS_KEY in config.js), plain embed as fallback ---------- */
var MAP_STYLE = [
  { elementType: "geometry", stylers: [{ color: "#e3e3e3" }] },
  { elementType: "labels.icon", stylers: [{ visibility: "off" }] },
  { elementType: "labels.text.fill", stylers: [{ color: "#5b5b5b" }] },
  { elementType: "labels.text.stroke", stylers: [{ color: "#f2f2f2" }] },
  { featureType: "administrative", elementType: "geometry", stylers: [{ visibility: "off" }] },
  { featureType: "landscape.man_made", elementType: "geometry", stylers: [{ color: "#d6d6d6" }] },
  { featureType: "poi", elementType: "geometry", stylers: [{ color: "#cfcfcf" }] },
  { featureType: "poi.park", elementType: "geometry", stylers: [{ color: "#c2c2c2" }] },
  { featureType: "road", elementType: "geometry", stylers: [{ color: "#ffffff" }] },
  { featureType: "road", elementType: "geometry.stroke", stylers: [{ visibility: "off" }] },
  { featureType: "transit", stylers: [{ visibility: "off" }] },
  { featureType: "water", elementType: "geometry", stylers: [{ color: "#4a4847" }] },
  { featureType: "water", elementType: "labels.text.fill", stylers: [{ color: "#b5b5b5" }] }
];
var MAPS_PROMISE = null;
var MAP_AUTH_FAILED = false;
window.gm_authFailure = function () { MAP_AUTH_FAILED = true; var el = document.getElementById("map"); if (el) fallbackMap(el, window.__mapSchool); };

function loadMaps(key) {
  if (window.google && window.google.maps && window.google.maps.Map) return Promise.resolve();
  if (MAPS_PROMISE) return MAPS_PROMISE;
  MAPS_PROMISE = new Promise(function (resolve, reject) {
    window.__mapsReady = resolve;
    var sc = document.createElement("script");
    sc.src = "https://maps.googleapis.com/maps/api/js?key=" + encodeURIComponent(key) + "&callback=__mapsReady";
    sc.async = true; sc.onerror = reject;
    document.head.appendChild(sc);
  });
  return MAPS_PROMISE;
}

function mapQuery(s) { return [s["School"], s["City"], s["State"]].filter(has).join(", "); }

/* Plain Google embed (no key). Turned gray with CSS so it still matches the site. */
function fallbackMap(el, s) {
  el.innerHTML = '<iframe class="gray" title="Map of ' + esc(s["School"]) + '" loading="lazy" referrerpolicy="no-referrer-when-downgrade" src="https://maps.google.com/maps?q=' + encodeURIComponent(mapQuery(s)) + '&z=14&output=embed"></iframe>';
}

function initMap(s) {
  var el = document.getElementById("map");
  if (!el) return;
  window.__mapSchool = s;
  var key = window.PORTAL_CONFIG && window.PORTAL_CONFIG.GOOGLE_MAPS_KEY;
  if (!key || MAP_AUTH_FAILED) { fallbackMap(el, s); return; }
  loadMaps(key).then(function () {
    if (!el.isConnected) return;
    function show(pos) {
      var map = new google.maps.Map(el, {
        center: pos, zoom: 14, styles: MAP_STYLE, disableDefaultUI: true, zoomControl: true,
        gestureHandling: "cooperative", clickableIcons: false
      });
      new google.maps.Marker({ position: pos, map: map, icon: { path: google.maps.SymbolPath.CIRCLE, scale: 9, fillColor: "#5cbf93", fillOpacity: 1, strokeColor: "#1b1c1e", strokeWeight: 3 } });
    }
    var lat = parseFloat(s["Latitude"]), lng = parseFloat(s["Longitude"]);
    if (!isNaN(lat) && !isNaN(lng)) { show({ lat: lat, lng: lng }); return; }
    var geo = new google.maps.Geocoder();
    geo.geocode({ address: mapQuery(s) }, function (res, status) {
      if (!el.isConnected) return;
      if (status === "OK" && res[0]) { show(res[0].geometry.location); return; }
      geo.geocode({ address: [s["City"], s["State"]].filter(has).join(", ") }, function (r2, st2) {
        if (!el.isConnected) return;
        if (st2 === "OK" && r2[0]) show(r2[0].geometry.location); else fallbackMap(el, s);
      });
    });
  }).catch(function () { if (el.isConnected) fallbackMap(el, s); });
}

var toastTimer;
function toast(msg) {
  var el = document.getElementById("toast");
  el.textContent = msg; el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(function () { el.hidden = true; }, 3600);
}

function render() {
  var id = location.hash.replace("#", "");
  var app = document.getElementById("app");
  var idx = -1;
  SCHOOLS.forEach(function (s, i) { if (s["School ID"] === id && isYes(s["Publish"])) idx = i; });
  if (STATE === "loading") { app.innerHTML = '<p class="state">Loading schools...</p>'; return; }
  if (STATE === "nourl") { app.innerHTML = '<p class="state">Set API_URL in config.js to connect the school database.</p>'; return; }
  if (STATE === "error") { app.innerHTML = '<p class="state">Could not load the school data. Please reload the page.</p>'; return; }
  if (idx >= 0) {
    app.innerHTML = renderDetail(SCHOOLS[idx], idx);
    initMap(SCHOOLS[idx]);
    document.title = SCHOOLS[idx]["School"] + " | Educatius";
    var b = document.getElementById("pdfBtn");
    if (b) b.addEventListener("click", function () { toast("PDF download is built into the live site. Downloads are disabled in this preview."); });
  } else {
    app.innerHTML = renderHome();
    bindToggle();
    document.title = "Educatius School Portal";
  }
  window.scrollTo(0, 0);
}
window.addEventListener("hashchange", render);
render();

(function load() {
  var url = window.PORTAL_CONFIG && window.PORTAL_CONFIG.API_URL;
  if (!url) { STATE = "nourl"; render(); return; }
  /* visitor country from the Vercel function; falls back to null (non-KR price) if it fails or is slow */
  var countryP = Promise.race([
    fetch("/api/country").then(function (r) { return r.json(); }).then(function (d) { return d.country || null; }),
    new Promise(function (res) { setTimeout(function () { res(null); }, 4000); })
  ]).catch(function () { return null; });
  fetch(url).then(function (r) { return r.json(); }).then(function (d) {
    return countryP.then(function (c) { COUNTRY = c; SCHOOLS = d.schools || []; STATE = "ready"; render(); });
  }).catch(function () { STATE = "error"; render(); });
})();
</script>
